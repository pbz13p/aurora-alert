name: aurora-alert

on:
  schedule:
    # 墨尔本晚上约 9pm–6am（UTC 10:00–19:59，覆盖夏令时和冬令时），每15分钟
    - cron: "*/15 10-19 * * *"
    # 每天墨尔本中午前后查未来3天预报（UTC 02:07）
    - cron: "7 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "realtime / daily / test"
        default: "test"

permissions:
  contents: write

concurrency:
  group: aurora
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Pick mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "7 2 * * *" ]; then
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          else
            echo "mode=realtime" >> "$GITHUB_OUTPUT"
          fi

      - name: Run
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 aurora.py "${{ steps.mode.outputs.mode }}"

      # 保存“已提醒”记录；仓库50天没动静时提交一次，防止 GitHub 停掉定时任务
      - name: Save state / keepalive
        run: |
          git config user.name "aurora-bot"
          git config user.email "aurora-bot@users.noreply.github.com"
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $((50*86400)) ]; then
            date -u +%F > .keepalive
            git add .keepalive
          fi
          git add state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "update aurora state [skip ci]"
            git push
          fi
